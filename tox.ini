[tox]
envlist = flake8
skipsdist = True
skip_missing_interpreters = True

[testenv:flake8]
commands =
    {envbindir}/flake8
deps =
    flake8
    flake8-coding

[flake8]
builtins = func
max-line-length = 160
ignore = E129,W503
require-code = True
exclude = .git,.tox,experiment

[pytest]
filterwarnings = default
addopts = --verbose --capture=no --cov=resources/lib/ --cov-report=xml --continue-on-collection-errors

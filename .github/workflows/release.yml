name: Release
on:
  push:
    tags:
    - 'v*'
jobs:
  build:
    name: Release service.upnext
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Build zip file
        run: |
          sudo apt-get install libxml2-utils
          make build release=1
      - name: Get zip filename
        id: get-filename
        run: |
          echo "filename=$(cd ..;ls service.upnext*.zip | head -1)" >> "$GITHUB_OUTPUT"
      - name: Get body
        id: get-body
        run: |
          # Changes of the newest release: the lines under the first "### v..." heading after "## Releases"
          description=$(awk '/^## Releases$/ {r=1; next} r && /^### v/ {if (s) exit; s=1; next} s && /^#/ {exit} s && NF {print}' README.md)
          echo "$description"
          {
            echo 'body<<EOF_BODY'
            echo "$description"
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: ${{ github.ref }}
          body: ${{ steps.get-body.outputs.body }}
          draft: false
          prerelease: false
      - name: Upload zip
        id: upload-zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_name: ${{ steps.get-filename.outputs.filename }}
          asset_path: ../${{ steps.get-filename.outputs.filename }}
          asset_content_type: application/zip
      - name: Generate distribution zip and submit to official kodi repository
        id: kodi-addon-submitter
        uses: xbmc/action-kodi-addon-submitter@v1.2
        with:
          kodi-repository: repo-scripts
          kodi-version: matrix
          addon-id: service.upnext
        env:
          GH_USERNAME: ${{secrets.GH_USERNAME}}
          GH_TOKEN: ${{secrets.GH_TOKEN}}
          EMAIL: ${{secrets.EMAIL}}
